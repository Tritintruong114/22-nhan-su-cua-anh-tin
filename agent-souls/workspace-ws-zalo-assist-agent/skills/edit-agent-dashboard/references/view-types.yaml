# View type schema reference for manage.yaml operation_phases[*].views[*]
#
# GENERATED FILE — do not edit by hand.
# Source: @tryopenclaw/use-case-ui-kit src/schema/view-types-doc.ts
# Regenerate: bun run gen-view-types <path>
#
# Each view type entry explains:
#   - description     : what the renderer does
#   - required_fields : agent MUST supply these when adding a View of this type
#   - optional_fields : agent MAY supply
#   - notes           : behaviour quirks an agent author should know
#
# Shared optional field on EVERY view: required_connector (string[]) — when set,
# the renderer shows a "connector not connected" stub until every listed
# connector reports connected, then mounts the view body.

view_types:
  textarea-edit-multi-section:
    description: Multi-section markdown editor. Reads a single markdown file, splits it by `## <section>` headers, and renders one editable textarea per section configured in `sections[]`. Save POSTs full file content back to `save_route`. Use for KB-like free-form text destinations with N sections under a single "Lưu tất cả" button.
    required_fields:
      type: textarea-edit-multi-section
      label: string, Vietnamese, ≤80 chars
      data_source:
        plugin_route: "string, GET → { content: string }"
      save_route: "string, POST { content: string } → 200"
      sections:
        - id: string, unique-within-view, kebab-case
          label: string, Vietnamese, ≤80 chars, shown above the textarea
          section: string, MUST match the markdown `## <header>` text exactly
    optional_fields:
      required_connector: string[], see top-level note
    notes: Adding a new section to an existing view = just extend `sections[]`. No plugin code change needed. New section appears in dashboard, the first save writes the new `## <header>` block into the file.
  textarea-edit:
    description: Single-blob markdown editor. Loads markdown from `data_source.plugin_route`, lets the operator edit + save full overwrite via `save_route`. When `section` is set, only that `## <header>` block is editable but the full file is still POSTed (renderer merges the edited body back before sending). Use for one editable destination per view. For multiple sections sharing one backing file under a single Save button, use textarea-edit-multi-section instead.
    required_fields:
      type: textarea-edit
      label: string, Vietnamese, ≤80 chars
      data_source:
        plugin_route: "string, GET → { ok: true, content: string }"
      save_route: "string, POST { content: string } → 200 { ok: true, bytes }"
    optional_fields:
      section: Level-2 markdown heading (without the leading `## `). When set, renderer surfaces only that section's body in the textarea and merges edits back via upsertMarkdownSection before POSTing the full file. Missing section on read = empty textarea; first save creates the `## <header>` block.
      single_line: boolean. When true, renders a one-line <Input> (no markdown editor / preview toggle). For short scalar values like a Drive folder URL. Incompatible with `section`.
      placeholder: string, shown when the field is empty
      save_label: string, custom save-button label (defaults to "Lưu")
      required_connector: string[], see top-level note
    notes: Save is full-overwrite, NOT append. Save button stays disabled until the textarea differs from the last known saved content. Section-aware mode lets one backing file (e.g. KNOWLEDGE_BASE.md) power N visually-separate textareas without any BE change.
  list-view:
    description: "Table of records with optional row actions and header actions. Calls `data_source.plugin_route` (GET) which MUST return `{ rows: object[] }`. Each row's fields are projected via `columns[]`."
    required_fields:
      type: list-view
      label: string
      data_source:
        plugin_route: "string, GET → { rows: object[] }"
      columns: string[], field names from the row schema
    optional_fields:
      row_actions: "Array of { label, type, route, body? }. `type: 'route-call'` POSTs to `route` (with `{row_id}` placeholder substituted) with optional body. `type: 'chat-prompt'` injects `prompt` into the embedded chat."
      header_actions: "Array of { label, type, url_route | route }. `type: 'external-link'` + `url_route` returns `{ url }` for a \"Mở X\" button."
      required_connector: string[], see top-level note
  data-import:
    description: File upload widget (typically CSV) that POSTs multipart to `upload_route`. Server-side parses + writes the destination file. Optional `merge_policy` lets the agent expose a per-import merge-strategy picker.
    required_fields:
      type: data-import
      label: string
      accept: string OR string[], file extension filter, e.g. '.csv' or ['.csv', '.tsv']
      upload_route: string, POST multipart → 200
    optional_fields:
      max_rows: integer, hard cap, e.g. 200
      merge_policy: "{ default: string, options: string[] }. Per-row merge strategy presented to the operator before upload. `default` MUST appear in `options`. When omitted, plugin defaults apply."
      required_connector: string[], see top-level note
  leads-view:
    description: Lead/order board. Like list-view but with first-run setup hook + per-row status actions. Used for Zalo sales lead pipelines.
    required_fields:
      type: leads-view
      label: string
      data_source:
        plugin_route: "string, GET → { rows: object[] }"
      columns: string[]
      first_run_prompt: '{ field: { id, label, placeholder? }, submit_route }. Shown when plugin returns "not_configured" on first GET — prompts user for one setup value (e.g. sheet URL) then POSTs to submit_route. Required by validator AND by FE renderer (accesses view.first_run_prompt.field without a null check).'
    optional_fields:
      row_actions: see list-view
      header_actions: see list-view
      required_connector: string[], see top-level note
  chart-view:
    description: Data chart (bar / line / area / pie) rendered from `data_source.plugin_route`. Plots one or more `series` against `chart.x_key`. Optional `header_metric` shows a headline number above the chart; optional `controls` add operator-driven query params (e.g. period selectors). Use for analytics / trend dashboards.
    required_fields:
      type: chart-view
      label: string
      data_source:
        plugin_route: "string, GET → { rows: object[] }"
      chart:
        kind: "one of: bar | line | area | pie"
        x_key: string, row key used for the X axis / category
        series:
          - id: string, row key holding this series value
            label: string, legend label
            tone: "optional, one of: brand | info | success | warning | neutral"
    optional_fields:
      chart.orientation: vertical | horizontal
      chart.emphasis: filled | outlined | hatched
      chart.density: compact | default | expanded
      chart.stacked: boolean, stack multiple series
      header_metric: "{ value_key, target_key?, delta_key?, unit?, caption? } — headline number above the chart."
      controls: "Array of { id, type: 'select', label, options: string[], default?, send_as? } — operator query controls appended to the data request."
      required_connector: string[], see top-level note
  block-grid:
    description: "Grid of clickable metric blocks. Plugin returns `{ rows: object[] }`; each row renders one card showing `block.title_key` + `block.metric_key`. Clicking a card sends `block.click_param` = row[`block.click_value_key`] (e.g. to drive a chat prompt or drill-down). Use for at-a-glance KPI tiles that are also navigable."
    required_fields:
      type: block-grid
      label: string
      data_source:
        plugin_route: "string, GET → { rows: object[] }"
      block:
        title_key: string, row key for the card title
        metric_key: string, row key for the headline metric
        click_param: string, query/param name emitted on click
        click_value_key: string, row key whose value is sent as click_param
    optional_fields:
      block.metric_unit: string, unit suffix on the metric
      block.subtitle_key: string, row key for a card subtitle
      block.tone: "one of: brand | info | success | warning | neutral"
      required_connector: string[], see top-level note
  grouped-list:
    description: "List of records grouped into collapsible sections by the `group_by` column. Calls `data_source.plugin_route` (GET → `{ rows: object[] }`) and buckets rows by each distinct value of `group_by`. Use when a flat list is long and a single categorical column gives a natural grouping."
    required_fields:
      type: grouped-list
      label: string
      data_source:
        plugin_route: "string, GET → { rows: object[] }"
      group_by: string, row key to group rows by
    optional_fields:
      empty_state: string, message shown when there are no rows
      required_connector: string[], see top-level note
  gap-report:
    description: Read-only report of "gaps" in some data set — what's missing, stale, or unanswered. Renders from `data_source.plugin_route`. Schema is thin in v0 (validator only enforces data_source.plugin_route).
    required_fields:
      type: gap-report
      label: string
      data_source:
        plugin_route: "string, GET → { items: object[] } (shape TBD, plugin-defined)"
    optional_fields:
      required_connector: string[], see top-level note
    notes: PLANNED — accepted by the schema but the FE renderer is not shipped yet; the dashboard shows a fallback. Validator deliberately loose in v0.
  kpi-strip:
    description: Horizontal strip of KPI tiles. Plugin returns one value per declared `kpis[]` entry. Use for at-a-glance dashboards (count, total, rate).
    required_fields:
      type: kpi-strip
      label: string
      data_source:
        plugin_route: "string, GET → { values: { <kpi_id>: number | string } }"
      kpis:
        - id: string, unique-within-view, kebab-case, matches a key in `values`
          label: string, shown under the value
    optional_fields:
      required_connector: string[], see top-level note
    notes: PLANNED — accepted by the schema but the FE renderer is not shipped yet; the dashboard shows a fallback.
path_safety_rules:
  - Reject paths containing `..`
  - Reject absolute paths (`/` prefix)
  - Reject paths starting with `.` (no dotfiles)
  - Reject paths matching `\\` or `\` (no backslashes — Windows-style)
  - Resolve final path under workspaceDir, MUST start with workspaceDir prefix
editable_scope:
  case_a:
    description: Rename / layout / reorder / remove. No new routes, no new files.
    allowed_paths:
      - /layout
      - /operation_phases/*/label
      - /operation_phases/*/help
      - /operation_phases/*/icon
      - /operation_phases/*/views/*/label
    allowed_ops:
      - replace
      - remove
      - move
  case_b:
    description: Add view/phase that reuses a route already wired in current manage.yaml.
    allowed_ops:
      - add
    constraints:
      - Any new view MUST set type to one of view_types above
      - Any new view's plugin_route / save_route / upload_route MUST appear as a value somewhere in current manage.yaml
      - "entry_condition for new phase MUST be: install_status == 'verified'"
  case_c:
    description: Generate new plugin handler + route + (optional) new file destination.
    constraints:
      - Allowed when no existing route fits — agent must justify in the diff explanation
      - Generated handlers MUST live in <plugin>/src/handlers/<feature>-{read,write}.ts
      - Generated handlers MUST import safeWorkspacePath() helper or equivalent path-safety guard
      - Build + restart + verify MUST succeed before manage.yaml is touched
